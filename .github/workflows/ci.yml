name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

      # dist/ is committed because the plugin installs by a plain git clone. If a source change
      # lands without a matching rebuild, every machine that installs from this repo silently
      # runs the old code, so a stale dist/ is a build failure rather than a warning.
      - name: dist/ must match the source it was built from
        # Explicit shell: the Windows runner defaults to PowerShell, which cannot parse this.
        shell: bash
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is stale. Run 'pnpm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi
          echo "dist/ is up to date."
